    - CA12
    - LDHA
    - LDHB
    - SLC16A1
    - SLC16A3
    - PKM
    - ENO1
  hypoxia:
    - HIF1A
    - VEGFA
    - BNIP3
    - DDIT4
    - EGLN1
    - NDRG1
  glycolysis_warburg:       # Genişletilmiş Warburg metabolizması
    - HK2
    - PFKP
    - ALDOA
    - PKM
    - LDHA
    - SLC16A3      # MCT4 — laktat taşıyıcı
    - ENO1
    - PGK1
    - CA9           # Asidoz marker
    - SLC2A1        # GLUT1
  oxidative_phosphorylation:
    - NDUFS1
    - NDUFA9
    - COX5A
    - COX6C
    - ATP5F1B
    - UQCRC1
    - COX4I1
    - NDUFB8
    - ATP5F1A
    - UQCRC2
  lipid_metabolism:          # Tümör lipid bağımlılığı
    - FASN         # Yağ asidi sentazı — ilaç hedefi
    - ACACA        # Asetil-CoA karboksilaz
    - SCD          # Stearoyl-CoA desatüraz
    - CPT1A        # Mitokondriyal yağ oksidasyonu
    - ACLY         # ATP-sitrat liyaz (FASN upstream)

immune_scores:
