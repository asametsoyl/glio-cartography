    receptor: CCR7
    pathway: "Naif T hücre yönlendirmesi"
  # ── Tümör İnvazyonu ve Göç ───────────────────────────────
  - ligand: HGF
    receptor: MET
    pathway: "Tümör hücre migrasyonu / invazyon"
  - ligand: EGF
    receptor: EGFR
    pathway: "Tümör proliferasyonu / invazif kenar"
  - ligand: SEMA4D
    receptor: PLXNB1
    pathway: "Aksonal rehberlik / tümör göçü"
  # ── Anjiyogenez ve Perivasküler Niş ─────────────────────
  - ligand: VEGFA
    receptor: KDR
    pathway: "Anjiogenez — endotelyal proliferasyon"
  - ligand: ANGPT1
    receptor: TEK
    pathway: "Damar stabilizasyonu"
  - ligand: ANGPT2
    receptor: TEK
    pathway: "Damar destabilizasyonu / yeni damar"
  - ligand: PDGFB
    receptor: PDGFRB
    pathway: "Perisit rekrutmanı / perivasküler niş"
  - ligand: DLL4
    receptor: NOTCH1
    pathway: "Notch — uc damar hücresi seçimi"


# -----------------------------------------------------------
# TME Niş Belirteçleri (Spatial Mikro-Nişler)
# -----------------------------------------------------------
tme_niches:
  perivaskuler_nis:
    description: "Endotel + Perisit + GSC — vasküler niş"
    markers:
      - PECAM1
      - VWF
      - CLDN5
      - KDR
      - FLT1
      - ANGPT2
      - PDGFRB
      - RGS5
  hipoksik_nekrotik_cekirdek:
    description: "Tümör merkezinde düşük O₂, yüksek metabolik stres"
    markers:
      - HIF1A
      - CA9
      - BNIP3
      - NDRG1
      - VEGFA
      - SLC2A1
      - LDHA
  immun_baskici_nis:
    description: "TAM + Treg yoğun bölge — T hücre tükenmesi"
    markers:
      - FOXP3
      - IL10
      - TGFB1
      - IDO1
      - PDCD1LG2
      - CD274
      - HAVCR2
  invazif_kenar:
    description: "Tümör-beyin sınırı — maksimum infiltrasyon"
    markers:
      - CHI3L1
      - VIM
      - FN1
      - MMP2
      - MMP9
      - ITGAV
      - TWIST1

# -----------------------------------------------------------
# İmmün Baskılanma Gen Seti (Genişletilmiş)
# -----------------------------------------------------------
immune_suppression_extended:
  metabolic_suppression:     # Metabolik immün baskı
    - ARG1       # Arginaz — L-arginin tüketimi
    - NOS2       # iNOS — nitrik oksit (M1'de öldürücü, M2'de izole)
    - IDO1       # İndolamin oksidaz — triptofan tüketimi
    - IDO2
    - TDO2       # Triptofan-2,3-dioksijenaz
  checkpoint_ligands:
    - CD274      # PD-L1
    - PDCD1LG2   # PD-L2
    - CD47       # Fagositozu engeller
    - LGALS9     # Galectin-9 (TIM-3 ligandı)
    - FGL1       # LAG-3 ligandı
  t_cell_suppression:
    - HAVCR2     # TIM-3
    - LAG3
    - TIGIT
    - VSIR       # VISTA — yeni checkpoint
    - CTLA4
    - FOXP3      # Treg aktivitesi

# -----------------------------------------------------------
# GNN Spatial Feature Skorları
# -----------------------------------------------------------
gnn_spatial_scores:
  node_features:
    - hypoxia_score
    - angiogenesis_score
    - immune_suppression_score
    - t_cell_activation_score
    - macrophage_polarization_score   # M1/M2 oranı
    - glycolysis_score
    - oxidative_phosphorylation_score
    - stemness_score                  # GSC skoru
    - antigen_presentation_score      # DC kapasitesi
    - dc_maturation_score
  edge_features:
    - lr_communication_score
    - spatial_proximity_um
    - ligand_expression
    - receptor_expression

# -----------------------------------------------------------
# InferCNV — Kopya Sayısı Varyasyonu Tespiti
# -----------------------------------------------------------
infercnv:
  run_infercnv: true
  reference_groups:   # Normal (kopya sayısı yok) referans hücreler
    - endothelial
    - t_cell
    - microglia
    - oligodendrocyte
  target_groups:      # Şüpheli tümör/reaktif hücreler
    - malignant_tumor
    - astrocyte
    - gbm_stem_cell
  window_size: 100    # Genomik kayan pencere boyutu
  threshold: 0.1      # CNV skoru eşiği
  key_alterations:    # GBM'e özgü bilinen mutasyonlar
    chr7_gain: [EGFR, MET, CDK6]   # Kromozom 7 artışı
    chr10_loss: [PTEN, DMBT1]       # Kromozom 10 kaybı
    chr9p_loss: [CDKN2A, CDKN2B]   # CDKN2A silinmesi

# -----------------------------------------------------------
# Explainable AI (XAI) — GNN Karar Yorumlama
# -----------------------------------------------------------
xai:
  explainer_method: "GNNExplainer"   # PGExplainer veya Captum da mevcut
  top_k_edges: 10      # Kararı en çok etkileyen 10 iletişim bağı
  top_k_nodes: 5       # Kararı en çok etkileyen 5 hücre/spot
  visualization: "subgraph_heatmap"
  output_format: "interactive_plotly" # Jüri için interaktif
  highlight_pathways: true            # İlgili L-R yolunu vurgula

# -----------------------------------------------------------
# Spatial Trajectory & Pseudotime (PAGA)
# -----------------------------------------------------------
trajectory:
  method: "PAGA"                    # Partition-based graph abstraction
  root_cell_type: "cd8_t_cell"      # Aktif / sağlıklı T hücresinden başla
  end_cell_type: "exhausted_t_cell" # Tükenmiş T hücresine doğru çiz
  spatial_vector_field: true        # Haritada oklu akış yönü
  additional_trajectories:
    - start: "m1_macrophage"
      end: "m2_macrophage"
      label: "Makrofaj M1→M2 polarizasyon yolu"
    - start: "cdc1"
      end: "modc"
      label: "DC işlevsizleşme yolu"
  diffusion_pseudotime: true
  plot_velocity_arrows: true

# -----------------------------------------------------------
# Klinik Metadata Entegrasyonu
# -----------------------------------------------------------
clinical_metadata:
  include_covariates: true
  source: "tcga"                    # TCGA-GBM'den çekilecek
  survival_model: "cox_ph"          # Cox proportional hazards
  features:
    patient_demographics:
      - age_at_diagnosis
      - gender
      - kps_score              # Karnofsky Performance Status
    molecular_profile:
      - IDH_status             # Mutant vs Wild-type (temel prognostik)
      - MGMT_promoter_status   # Methylated → TMZ'ye yanıt verir
      - CDKN2A_deletion
      - EGFR_amplification
      - TERT_promoter_status
    treatment_history:
      - surgery_extent         # GTR / STR / biopsy
      - radiotherapy           # Yes/No
      - temozolomide_tmz       # Yes/No
      - bevacizumab            # Anti-VEGF tedavi
    outcomes:
      - survival_months        # Overall Survival (OS)
      - progression_free_months
      - response_to_treatment
  tme_survival_correlation:  # Hangi TME özellikleri survival ile korelasyon?
    features_to_correlate:
      - m2_fraction            # M2-TAM oranı
      - t_cell_exhaustion_score
      - stemness_score
      - hypoxia_score
      - dc_maturation_score
      - antigen_presentation_score

# -----------------------------------------------------------
# Graph Construction
# -----------------------------------------------------------
graph:
  n_neighbors: 6           # KNN for spatial graph
  spatial_distance_um: 300 # Max distance (microns) for communication
  edge_weight_alpha: 0.5   # Balance spatial vs. comm. weight

# -----------------------------------------------------------
# GNN Model
# -----------------------------------------------------------
gnn:
  model: "GAT"             # GraphSAGE or GAT
  hidden_channels: 256
  num_heads: 8             # For GAT
  num_layers: 3
  dropout: 0.3
  learning_rate: 0.001
  epochs: 200
  batch_size: 128
  device: "mps"            # M3 Apple Silicon GPU

# -----------------------------------------------------------
# Drug Matching
# -----------------------------------------------------------
drug_matching:
  dgidb_api: "https://dgidb.org/api/v2"
  sources:
    - DrugBank
    - ChEMBL
    - TTD
    - NCI
  min_interaction_score: 0.5

# -----------------------------------------------------------
# Visualization
# -----------------------------------------------------------
visualization:
  theme: "dark"
  colormap_celltypes: "tab20"
  colormap_expression: "viridis"
  colormap_communication: "RdYlBu_r"
  spot_size: 1.5
  figure_dpi: 300

