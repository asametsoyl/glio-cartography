# ============================================================
# GLIO-CARTOGRAPHY — Global Configuration
# ============================================================

project:
  name: "GLIO-CARTOGRAPHY"
  version: "1.0.0"
  description: "Spatial Tumor Microenvironment Atlas for Glioblastoma"
  output_dir: "outputs"
  log_level: "INFO"

# -----------------------------------------------------------
# Data Paths
# -----------------------------------------------------------
data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  spatial_dir: "data/spatial"
  scrna_dir: "data/scRNA"
  figures_dir: "outputs/figures"
  models_dir: "outputs/models"
  reports_dir: "outputs/reports"

# -----------------------------------------------------------
# Preprocessing Parameters
# -----------------------------------------------------------
preprocessing:
  scrna:
    min_genes: 200          # Minimum genes per cell
    min_cells: 3            # Minimum cells per gene
    max_genes: 8000         # Maximum genes (doublet filter)
    max_mito_pct: 20.0      # Max mitochondrial %
    n_top_genes: 3000       # Highly variable genes
    n_pcs: 50               # PCA components
    n_neighbors: 15         # KNN for graph
    leiden_resolution: 0.8  # Clustering resolution
  spatial:
    min_counts: 1000
    min_genes: 300
    max_counts: 40000
    max_mito_pct: 25.0
    n_top_genes: 3000

# -----------------------------------------------------------
# Cell Type Annotation Markers
# -----------------------------------------------------------
cell_markers:
  malignant_tumor:
    - EGFR
    - PTEN
    - IDH1
    - TP53
    - CDKN2A
    - MET
  # ── GBM Kök Hücre (GSC) Markerları ──────────────────────
  gbm_stem_cell:
    - PROM1      # CD133 — GSC tanımlayıcısı
    - NES        # Nestin — sinir kök hücresi
    - SOX2       # Çoğullaşma kapasitesi
    - MYC        # Onkojen, GSC proliferasyonu
    - PDGFRA     # Kök hücre sinyali
    - OLIG2      # GSC transkripsiyon faktörü
    - AQP4       # İnvazif kenarda su kanalı
    - ITGA6      # CD49f — GSC niş tutunması
  # ── Makrofaj Kutuplaşması ─────────────────────────────────
  m1_macrophage:       # Anti-tümör / inflamatuvar fenotip
    - CD80
    - CD86
    - CXCL10
    - NOS2       # Nitrik oksit sentaz — tümör öldürücü
    - IL12A
    - TNF
    - HLA-DRA
  m2_macrophage:       # Pro-tümör / immünsüpresif fenotip
    - CD163
    - MRC1       # CD206
    - ARG1       # Arginaz 1 — metabolik baskı
    - VEGFA      # Anjiogenez desteği
    - IL10
    - CCL22
    - TGFB1
  tumor_associated_macrophage:
    - CD163
    - MRC1
    - MSR1
    - CCL2
    - SPP1
    - APOE
  microglia:
    - CX3CR1
    - P2RY12
    - TMEM119
    - SALL1
    - SLC2A5
  t_cell:
    - CD3D
    - CD3E
    - CD3G
    - TRAC
  exhausted_t_cell:
    - PDCD1    # PD-1
    - TOX
    - TIGIT
    - LAG3
    - TIM3
    - HAVCR2
  cd8_t_cell:
    - CD8A
    - CD8B
    - GZMB       # Granzyme B — sitotoksik aktivite
    - PRF1       # Perforin
    - IFNG
  treg:
    - FOXP3      # Treg master regülatörü
    - IL2RA      # CD25
    - CTLA4
    - IKZF2      # Helios
    - TNFRSF18   # GITR
  nk_cell:
    - NCAM1
    - NKG7
    - GNLY
    - KLRB1
    - FCGR3A     # CD16
  # ── Dendritik Hücre Alt Tipleri ──────────────────────────
  cdc1:         # Konvansiyonel DC1 — çapraz sunum, anti-tümör
    - CLEC9A     # DNGR-1 — cDC1 tanımlayıcısı
    - XCR1       # cDC1'e özgü kemokin reseptörü
    - CADM1
    - IRF8       # Transkripsiyon faktörü
    - BATF3
  cdc2:         # Konvansiyonel DC2 — CD4+ T aktivasyonu
    - CLEC10A    # CD301 — cDC2 tanımlayıcısı
    - CD1C
    - FCER1A
    - IRF4
    - CLEC12A
  pdc:          # Plazmositoid DC — interferon-α üretimi
    - LILRA4     # ILT7 — pDC tanımlayıcısı
    - CLEC4C     # CD303
    - IL3RA      # CD123
    - TCF4
    - SIGLEC6
  modc:         # Monosit kaynaklı DC — inflamasyon ortamı
    - CD14
    - CD1C
    - CCR2
    - ITGAM      # CD11b
    - FCGR1A     # CD64
  # ── Genel DC Aktivasyon Markerleri ───────────────────────
  dc_activation:
    - HLA-DRA    # MHC-II antigen sunum
    - HLA-DRB1
    - CD80       # Co-stimülatör — B7-1
    - CD86       # Co-stimülatör — B7-2
    - CD40
    - CCR7       # Olgunlaşmış DC — lenf noduna göç
  oligodendrocyte:
    - MBP
    - MOG
    - MOBP
    - PLP1
  astrocyte:
    - GFAP
    - AQP4
    - S100B
    - VIM
  endothelial:
    - PECAM1
    - VWF
    - CLDN5
    - FLT1
  pericyte:
    - PDGFRB
    - RGS5
    - ACTA2

# -----------------------------------------------------------
# GBM Molecular Subtypes (Neftel 2019)
# -----------------------------------------------------------
gbm_states:
  MES:   [VIM, CHI3L1, CD44, FN1, ANPEP, SERPINE1]
  AC:    [GFAP, ALDOC, AQP4, S100B, APOE]
  NPC:   [SOX4, DCX, DLL3, OLIG2, ASCL1]
  OPC:   [PDGFRA, CSPG4, OLIG1, SOX10, GPR17]

