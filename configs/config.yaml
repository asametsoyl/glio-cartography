# -----------------------------------------------------------
# Ligand-Receptor Pairs of Interest
# -----------------------------------------------------------
lr_pairs_focus:
  - ligand: CD274      # PD-L1
    receptor: PDCD1    # PD-1
    pathway: "Immune checkpoint"
  - ligand: SPP1
    receptor: CD44
    pathway: "Macrophage-tumor crosstalk"
  - ligand: MIF
    receptor: CD74
    pathway: "Immunosuppression"
  - ligand: TGFB1
    receptor: TGFBR1
    pathway: "TGF-beta signaling"
  - ligand: CXCL12
    receptor: CXCR4
    pathway: "Tumor invasion"
  - ligand: VEGFA
    receptor: FLT1
    pathway: "Angiogenesis"
  - ligand: LGALS9
    receptor: HAVCR2   # TIM-3
    pathway: "T-cell exhaustion"
  # ── DC ile ilgili L-R çiftleri ─────────────────────────
  - ligand: CD80
    receptor: CD28
    pathway: "DC–T cell co-stimulation (anti-tumor)"
  - ligand: CD80
    receptor: CTLA4
    pathway: "DC–Treg checkpoint (immunosuppressive)"
  - ligand: CCL19
    receptor: CCR7
    pathway: "DC maturation & lymph node migration"
  - ligand: IL10
    receptor: IL10RA
    pathway: "Tolerogenic DC — immunosuppression"
  - ligand: TGFB1
    receptor: TGFBR2
    pathway: "DC-mediated Treg induction"
  - ligand: XCL1
    receptor: XCR1
    pathway: "cDC1 recruitment (anti-tumor)"
  # ── Makrofaj Rekrutmanı ve Polarizasyonu ────────────────
  - ligand: CCL2
    receptor: CCR2
    pathway: "Monosit rekrutmanı / TAM oluşumu"
  - ligand: CSF1
    receptor: CSF1R
    pathway: "TAM hayatta kalma / farklılaşma"
  - ligand: CX3CL1
    receptor: CX3CR1
    pathway: "Mikroglia homeostazı"
  - ligand: IL34
    receptor: CSF1R
    pathway: "Alternatif TAM aktivasyon"
  - ligand: CCL5
    receptor: CCR5
    pathway: "M2-TAM polarizasyon sinyali"
  # ── T-Hücre Baskılanması (Immune Checkpoint) ────────────
  - ligand: CD47
    receptor: SIRPA
    pathway: "'Beni yeme' sinyali — fagositoz kaçışı"
  - ligand: CD274
    receptor: PDCD1
    pathway: "PD-L1 / PD-1 immune checkpoint"
  - ligand: PDCD1LG2
    receptor: PDCD1
    pathway: "PD-L2 / PD-1 alternatif checkpoint"
  - ligand: CD86
    receptor: CTLA4
    pathway: "DC–Treg CTLA-4 yolu"
  - ligand: FGL1
    receptor: LAG3
    pathway: "Fibrinojen benzeri ligand — T exhaustion"
  # ── Makrofaj–Tümör Crosstalk ─────────────────────────────
  - ligand: MIF
    receptor: CD74
    pathway: "Makrofaj göç inhibitörü — immünsüprasyon"
  - ligand: IL10
    receptor: IL10RA
    pathway: "TAM→T hücre baskılama (IL-10 ekseni A)"
  - ligand: IL10
    receptor: IL10RB
    pathway: "TAM→T hücre baskılama (IL-10 ekseni B)"
  - ligand: TGFB1
    receptor: TGFBR1
    pathway: "TGF-β stromal yeniden programlama"
  # ── T-Hücre Rekrutmanı & Anti-Tümör Yanıt ───────────────
  - ligand: CXCL9
    receptor: CXCR3
    pathway: "CD8+ T rekrutmanı (anti-tümör)"
  - ligand: CXCL10
    receptor: CXCR3
    pathway: "CD8+ T ve NK rekrutmanı (anti-tümör)"
  - ligand: CXCL11
    receptor: CXCR3
    pathway: "T hücre aktivasyonu ve göçü"
  - ligand: CCL19
    receptor: CCR7
    pathway: "DC olgunlaşması / lenf noduna göç"
