[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spatialcore"
version = "0.0.1"
description = "Tissue-agnostic spatial transcriptomics engine with 3D serial-section support (research use only)"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy", "pydantic>=2", "pyyaml", "h5py"]

[project.optional-dependencies]
anndata = ["anndata"]
test = ["pytest", "anndata"]

[tool.setuptools.packages.find]
include = ["spatialcore*"]

[tool.pytest.ini_options]
testpaths = ["tests/spatialcore"]
