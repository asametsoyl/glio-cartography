name: Tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: python_backend/requirements-test.txt

      - name: Install CPU PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install test dependencies
        run: pip install -r python_backend/requirements-test.txt

      - name: Backend tests (unit + synthetic-data smoke)
        working-directory: python_backend
        run: python -m pytest tests -q

  spatialcore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install spatialcore with test extras
        run: pip install -e '.[test]'

      - name: spatialcore tests (data model, loaders, phantom)
        run: python -m pytest tests/spatialcore -q

  renderer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check renderer and electron scripts
        run: |
          for f in renderer/app*.js renderer/i18n.js electron/*.js; do
            node --check "$f"
          done

      - name: Locale integrity and protocol tests
        run: |
          node tests/i18n.test.js
          node tests/protocol_test.js

      - name: Pure-python math tests
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          for t in tests/*.test.py; do python "$t"; done
