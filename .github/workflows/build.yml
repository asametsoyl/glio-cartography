name: Build & Release Glio-Cartography

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Pin torch to a version that has PyG pre-built wheels (avoids source compilation)
  TORCH_VERSION: "2.6.0"
  TORCH_VISION_VERSION: "0.21.0"

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Build Python env + Electron installer per OS
  # ─────────────────────────────────────────────────────────────
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            python_env_zip: python_env_windows.zip

          - os: macos-latest
            platform: mac
            python_env_zip: python_env_macos.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # Install Miniforge (base only)
      - name: Setup Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          auto-activate: false
          activate-environment: ""
          conda-remove-defaults: true

      # ── Create Python environment & install packages ─────────

      - name: Create Python Env + Install Packages (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $TORCH_VER = "${{ env.TORCH_VERSION }}"
          $TORCH_VISION_VER = "${{ env.TORCH_VISION_VERSION }}"
          $PyG_URL = "https://data.pyg.org/whl/torch-${TORCH_VER}+cpu.html"
          $reqsFile = "$env:GITHUB_WORKSPACE\desktop_app\requirements_server.txt"

          Write-Host "=== Step 1: Create conda env ==="
          conda create -n gliocarto python=3.10 -y -c conda-forge

          Write-Host "=== Step 2: Install PyTorch CPU (pinned) ==="
          conda run -n gliocarto pip install `
            "torch==$TORCH_VER" "torchvision==$TORCH_VISION_VER" `
            --index-url https://download.pytorch.org/whl/cpu `
            --no-cache-dir

          Write-Host "=== Step 3: Install PyG + extensions (pre-built wheels) ==="
          conda run -n gliocarto pip install `
            torch-geometric torch-scatter torch-sparse torch-cluster `
            -f $PyG_URL `
            --no-cache-dir

          Write-Host "=== Step 4: Verify requirements file ==="
          if (-Not (Test-Path $reqsFile)) {
            Write-Error "requirements_server.txt not found at: $reqsFile"
            exit 1
          }
          Write-Host "Found requirements file: $reqsFile"

          Write-Host "=== Step 5: Install remaining packages ==="
          $filtered = Get-Content $reqsFile | Where-Object {
            $_.Trim() -ne "" -and
            -not $_.StartsWith("#") -and
            -not $_.StartsWith("torch") -and
            -not $_.Contains("index-url") -and
            -not $_.Contains("pyg.org")
          }
          $filtered | Out-File -FilePath "$env:TEMP\filtered_reqs.txt" -Encoding utf8
          Write-Host "Packages to install:"
          Get-Content "$env:TEMP\filtered_reqs.txt"
          conda run -n gliocarto pip install -r "$env:TEMP\filtered_reqs.txt" --no-cache-dir

          Write-Host "=== Installation complete! ==="

      - name: Create Python Env + Install Packages (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          TORCH_VER="${{ env.TORCH_VERSION }}"
          TORCH_VISION_VER="${{ env.TORCH_VISION_VERSION }}"
          PyG_URL="https://data.pyg.org/whl/torch-${TORCH_VER}+cpu.html"
          REQS_FILE="${GITHUB_WORKSPACE}/desktop_app/requirements_server.txt"

          echo "=== Step 1: Create conda env ==="
          conda create -n gliocarto python=3.10 -y -c conda-forge

          echo "=== Step 2: Install PyTorch CPU (pinned) ==="
          conda run -n gliocarto pip install \
            "torch==${TORCH_VER}" "torchvision==${TORCH_VISION_VER}" \
            --index-url https://download.pytorch.org/whl/cpu \
            --no-cache-dir

          echo "=== Step 3: Install PyG + extensions (pre-built wheels) ==="
          conda run -n gliocarto pip install \
            torch-geometric torch-scatter torch-sparse torch-cluster \
            -f "${PyG_URL}" \
            --no-cache-dir

          echo "=== Step 4: Verify requirements file ==="
          if [ ! -f "$REQS_FILE" ]; then
            echo "ERROR: requirements_server.txt not found at: $REQS_FILE"
            exit 1
          fi
          echo "Found requirements file: $REQS_FILE"

          echo "=== Step 5: Install remaining packages ==="
          grep -v "^torch" "$REQS_FILE" | \
            grep -v "index-url" | \
            grep -v "pyg.org" | \
            grep -v "^#" | \
            grep -v "^$" > /tmp/filtered_reqs.txt
          echo "Packages to install:"
          cat /tmp/filtered_reqs.txt
          conda run -n gliocarto pip install -r /tmp/filtered_reqs.txt --no-cache-dir

          echo "=== Installation complete! ==="

      # ── conda-pack the environment ───────────────────────────

      - name: Pack Python Environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "Installing conda-pack..."
          conda install -n gliocarto conda-pack -y -c conda-forge
          Write-Host "Packing environment..."
          conda run -n gliocarto conda-pack -n gliocarto `
            -o "${{ matrix.python_env_zip }}" `
            --ignore-editable-packages
          $item = Get-Item "${{ matrix.python_env_zip }}"
          Write-Host "Packed: $($item.Name) — $([math]::Round($item.Length/1GB, 2)) GB"

      - name: Pack Python Environment (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "Installing conda-pack..."
          conda install -n gliocarto conda-pack -y -c conda-forge
          echo "Packing environment..."
          conda run -n gliocarto conda-pack -n gliocarto \
            -o "${{ matrix.python_env_zip }}" \
            --ignore-editable-packages
          ls -lh "${{ matrix.python_env_zip }}"

      # ── NPM + Electron build ─────────────────────────────────

      - name: Install NPM Dependencies
        working-directory: desktop_app
        run: npm install --ignore-scripts

      - name: Build Electron App (Windows)
        if: runner.os == 'Windows'
        working-directory: desktop_app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64

      - name: Build Electron App (macOS)
        if: runner.os == 'macOS'
        working-directory: desktop_app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --mac --x64

      # ── Upload artifacts ─────────────────────────────────────

      - name: Upload Python Env Zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.python_env_zip }}
          path: ${{ matrix.python_env_zip }}
          retention-days: 7
          if-no-files-found: error

      - name: Upload Windows Installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: installer-win
          path: desktop_app/dist/*.exe
          retention-days: 7
          if-no-files-found: warn

      - name: Upload macOS Installer
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: installer-mac
          path: desktop_app/dist/*.dmg
          retention-days: 7
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Publish GitHub Release (only on version tags)
  # ─────────────────────────────────────────────────────────────
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: List Release Files
        run: find release-files -type f -ls

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Glio-Cartography ${{ github.ref_name }}"
          body: |
            ## Glio-Cartography ${{ github.ref_name }}

            ### 🪟 Windows Kurulum
            1. `Glio-Cartography Setup *.exe` dosyasını indirip çalıştırın
            2. Uygulama ilk açılışta analiz bileşenlerini (~1.5 GB) otomatik indirir
            3. İnternet bağlantısı yalnızca ilk kurulumda gereklidir

            ### 🍎 macOS Kurulum
            1. `Glio-Cartography*.dmg` dosyasını açın
            2. Uygulamayı Applications klasörüne sürükleyin

            > CPU-only PyTorch 2.6.0 + PyTorch Geometric 2.x kullanılmaktadır.
          files: |
            release-files/*.exe
            release-files/*.dmg
            release-files/python_env_windows.zip
            release-files/python_env_macos.zip
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
