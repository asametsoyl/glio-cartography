name: Build & Release Glio-Cartography

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Build Python env + Electron installer per OS
  # ─────────────────────────────────────────────────────────────
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            python_env_zip: python_env_windows.zip

          - os: macos-latest
            platform: mac
            python_env_zip: python_env_macos.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # Install Miniforge (base only — we create the env manually)
      - name: Setup Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          auto-activate: false
          activate-environment: ""
          conda-remove-defaults: true

      # ── Create Python environment ────────────────────────────
      - name: Create & Install Python Env (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          conda create -n gliocarto python=3.10 -y -c conda-forge
          # Install PyTorch CPU first (index-url doesn't work in requirements.txt on Windows reliably)
          conda run -n gliocarto pip install torch torchvision `
            --index-url https://download.pytorch.org/whl/cpu
          # Install torch-geometric separately (needs torch pre-installed)
          conda run -n gliocarto pip install torch-geometric torch-scatter torch-sparse torch-cluster
          # Install the rest from requirements file (exclude torch lines)
          $reqs = Get-Content desktop_app/requirements_server.txt | `
            Where-Object { $_ -notmatch "^torch" -and $_ -notmatch "index-url" -and $_ -notmatch "^#" -and $_ -ne "" }
          $reqs | Out-File -FilePath filtered_reqs.txt -Encoding utf8
          conda run -n gliocarto pip install -r filtered_reqs.txt

      - name: Create & Install Python Env (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          conda create -n gliocarto python=3.10 -y -c conda-forge
          # Install PyTorch CPU first
          conda run -n gliocarto pip install torch torchvision \
            --index-url https://download.pytorch.org/whl/cpu
          # Install torch-geometric
          conda run -n gliocarto pip install torch-geometric torch-scatter torch-sparse torch-cluster
          # Install the rest (skip torch lines from requirements.txt)
          grep -v "^torch" desktop_app/requirements_server.txt | \
            grep -v "index-url" | grep -v "^#" | grep -v "^$" > filtered_reqs.txt
          conda run -n gliocarto pip install -r filtered_reqs.txt

      # ── Pack with conda-pack ─────────────────────────────────
      - name: Pack Python Environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          conda install -n gliocarto conda-pack -y -c conda-forge
          conda run -n gliocarto conda-pack -n gliocarto `
            -o ${{ matrix.python_env_zip }} `
            --ignore-editable-packages
          Get-Item ${{ matrix.python_env_zip }} | Select-Object Name, Length

      - name: Pack Python Environment (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          conda install -n gliocarto conda-pack -y -c conda-forge
          conda run -n gliocarto conda-pack -n gliocarto \
            -o ${{ matrix.python_env_zip }} \
            --ignore-editable-packages
          ls -lh ${{ matrix.python_env_zip }}

      # ── NPM + Electron build ─────────────────────────────────
      - name: Install NPM Dependencies
        working-directory: desktop_app
        run: npm install --ignore-scripts

      - name: Build Electron App (Windows)
        if: runner.os == 'Windows'
        working-directory: desktop_app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64

      - name: Build Electron App (macOS)
        if: runner.os == 'macOS'
        working-directory: desktop_app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --mac --x64

      # ── Upload artifacts ─────────────────────────────────────
      - name: Upload Python Env Zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.python_env_zip }}
          path: ${{ matrix.python_env_zip }}
          retention-days: 7
          if-no-files-found: error

      - name: Upload Windows Installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: installer-win
          path: desktop_app/dist/*.exe
          retention-days: 7
          if-no-files-found: warn

      - name: Upload macOS Installer
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: installer-mac
          path: desktop_app/dist/*.dmg
          retention-days: 7
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Publish GitHub Release (only on version tags)
  # ─────────────────────────────────────────────────────────────
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: List Release Files
        run: find release-files -type f -ls

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Glio-Cartography ${{ github.ref_name }}"
          body: |
            ## Glio-Cartography ${{ github.ref_name }}

            ### 🪟 Windows Kurulum
            1. `Glio-Cartography Setup *.exe` dosyasını indirip çalıştırın
            2. Uygulama ilk açılışta analiz bileşenlerini (~1.5 GB) otomatik indirir
            3. İnternet bağlantısı yalnızca ilk kurulumda gereklidir

            ### 🍎 macOS Kurulum
            1. `Glio-Cartography*.dmg` dosyasını açın
            2. Uygulamayı Applications klasörüne sürükleyin

            > CPU-only PyTorch kullanılmaktadır. CUDA için yerel derleme yapın.
          files: |
            release-files/*.exe
            release-files/*.dmg
            release-files/python_env_windows.zip
            release-files/python_env_macos.zip
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
