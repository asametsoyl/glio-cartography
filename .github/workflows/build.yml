name: Build & Release Glio-Cartography

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # JOB 1: Build Python env zip + Electron installer for each OS
  # ─────────────────────────────────────────────────────────────────────────
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            python_env_zip: python_env_windows.zip
            electron_cmd: npm run build:win
            artifact_glob: "desktop_app/dist/*.exe"

          - os: macos-latest
            platform: mac
            python_env_zip: python_env_macos.zip
            electron_cmd: npm run build:mac
            artifact_glob: "desktop_app/dist/*.dmg"

    runs-on: ${{ matrix.os }}

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout Code
        uses: actions/checkout@v4

      # ── 2. Node.js ───────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # ── 3. Conda (Miniforge) ─────────────────────────────────────────────
      - name: Setup Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: gliocarto
          python-version: "3.10"
          auto-activate-base: false

      # ── 4. Install Python deps ────────────────────────────────────────────
      - name: Install Python Dependencies
        shell: bash -l {0}
        run: |
          conda install -y -c conda-forge \
            numpy pandas scipy matplotlib seaborn \
            scikit-learn scikit-image statsmodels \
            networkx h5py pytables pyyaml tqdm \
            requests pillow
          pip install --no-cache-dir \
            fastapi "uvicorn[standard]" \
            "scanpy>=1.9.6" "anndata>=0.10.0" "squidpy>=1.4.0" \
            leidenalg python-igraph \
            "tangram-sc>=1.0.4" \
            "torch>=2.1.0" \
            "torch-geometric>=2.4.0" \
            optuna \
            "plotly>=5.18.0" \
            pydeseq2 decoupler-py gseapy adjustText \
            bioservices mygene gprofiler-official \
            "openai>=1.0.0" jinja2 fpdf2 \
            zarr "dask[dataframe]" pyarrow \
            python-dotenv rich loguru colorama

      # ── 5. Package Python env with conda-pack ────────────────────────────
      - name: Pack Python Environment
        shell: bash -l {0}
        run: |
          pip install conda-pack
          conda pack -n gliocarto -o ${{ matrix.python_env_zip }} --ignore-editable-packages
          echo "Packed size: $(du -sh ${{ matrix.python_env_zip }})"

      # ── 6. NPM install ────────────────────────────────────────────────────
      - name: Install NPM Dependencies
        working-directory: desktop_app
        run: npm install --ignore-scripts

      # ── 7. Build Electron installer ──────────────────────────────────────
      - name: Build Electron App
        working-directory: desktop_app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ matrix.platform }}" = "win" ]; then
            npx electron-builder --win --x64
          else
            npx electron-builder --mac --x64
          fi
        shell: bash

      # ── 8. Upload Python env zip as artifact ─────────────────────────────
      - name: Upload Python Env Zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.python_env_zip }}
          path: ${{ matrix.python_env_zip }}
          if-no-files-found: error

      # ── 9. Upload Electron installer as artifact ──────────────────────────
      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 2: Create GitHub Release and attach all files
  # Runs only when triggered by a version tag (v*)
  # ─────────────────────────────────────────────────────────────────────────
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: List Release Files
        run: find release-files -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Glio-Cartography ${{ github.ref_name }}"
          body: |
            ## Glio-Cartography ${{ github.ref_name }}

            ### Kurulum
            1. **Windows**: `Glio-Cartography Setup *.exe` dosyasını indirip çalıştırın.
            2. Uygulama ilk açılışta Python bileşenlerini otomatik olarak indirir.

            ### Dosyalar
            | Dosya | Açıklama |
            |---|---|
            | `Glio-Cartography Setup *.exe` | Windows Kurulum Dosyası |
            | `python_env_windows.zip` | Windows Python Ortamı (uygulama tarafından otomatik indirilir) |
            | `python_env_macos.zip` | macOS Python Ortamı |
          files: |
            release-files/**/*.exe
            release-files/**/*.dmg
            release-files/**/python_env_*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
