name: Build & Release Glio-Cartography

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TORCH_VERSION: "2.6.0"
  TORCH_VISION_VERSION: "0.21.0"

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            python_env_zip: python_env_windows.zip

          - os: macos-latest
            platform: mac
            python_env_zip: python_env_macos.zip

          - os: ubuntu-latest
            platform: linux
            python_env_zip: python_env_linux.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          auto-activate: false
          activate-environment: ""
          conda-remove-defaults: true

      # ── Debug: show repo layout ──────────────────────────────
      - name: Show workspace layout
        shell: bash
        run: |
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "--- Repo root contents ---"
          ls -la "$GITHUB_WORKSPACE"
          echo "--- requirements_server.txt check ---"
          ls -la "$GITHUB_WORKSPACE/requirements_server.txt" 2>/dev/null && echo "FOUND" || echo "NOT FOUND"

      # ── Install Python packages (Windows) ────────────────────
      - name: Create & Install Python Env (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $TORCH_VER  = "${{ env.TORCH_VERSION }}"
          $TV_VER     = "${{ env.TORCH_VISION_VERSION }}"
          $PyG_URL    = "https://data.pyg.org/whl/torch-${TORCH_VER}+cpu.html"
          # requirements_server.txt is at the repo root (= GITHUB_WORKSPACE)
          $reqsFile   = "$env:GITHUB_WORKSPACE\requirements_server.txt"

          Write-Host "=== Step 1: Create conda env ==="
          conda create -n gliocarto python=3.10 -y -c conda-forge

          Write-Host "=== Step 2: PyTorch CPU $TORCH_VER ==="
          conda run -n gliocarto pip install `
            "torch==$TORCH_VER" "torchvision==$TV_VER" `
            --index-url https://download.pytorch.org/whl/cpu --no-cache-dir

          Write-Host "=== Step 3: PyG pre-built wheels ==="
          conda run -n gliocarto pip install `
            torch-geometric torch-scatter torch-sparse torch-cluster `
            -f $PyG_URL --no-cache-dir

          Write-Host "=== Step 4: Verify requirements file ==="
          if (-Not (Test-Path $reqsFile)) {
            Write-Host "Files in workspace:"
            Get-ChildItem "$env:GITHUB_WORKSPACE" | Select-Object Name
            Write-Error "requirements_server.txt NOT FOUND at: $reqsFile"
            exit 1
          }
          Write-Host "OK: $reqsFile"

          Write-Host "=== Step 5: Install remaining packages ==="
          $filtered = Get-Content $reqsFile | Where-Object {
            $_.Trim() -ne "" -and
            -not $_.StartsWith("#") -and
            -not $_.StartsWith("torch") -and
            -not $_.Contains("index-url") -and
            -not $_.Contains("pyg.org")
          }
          $filtered | Out-File -FilePath "$env:TEMP\filtered_reqs.txt" -Encoding utf8
          conda run -n gliocarto pip install -r "$env:TEMP\filtered_reqs.txt" --no-cache-dir
          Write-Host "=== Done! ==="

      # ── Install Python packages (macOS/Linux) ────────────────
      - name: Create & Install Python Env (macOS/Linux)
        if: runner.os == 'macOS' || runner.os == 'Linux'
        shell: bash
        run: |
          TORCH_VER="${{ env.TORCH_VERSION }}"
          TV_VER="${{ env.TORCH_VISION_VERSION }}"
          PyG_URL="https://data.pyg.org/whl/torch-${TORCH_VER}+cpu.html"
          # requirements_server.txt is at the repo root
          REQS_FILE="${GITHUB_WORKSPACE}/requirements_server.txt"

          echo "=== Step 1: Create conda env ==="
          conda create -n gliocarto python=3.10 -y -c conda-forge

          echo "=== Step 2: PyTorch CPU ${TORCH_VER} ==="
          conda run -n gliocarto pip install \
            "torch==${TORCH_VER}" "torchvision==${TV_VER}" \
            --index-url https://download.pytorch.org/whl/cpu --no-cache-dir

          echo "=== Step 3: PyG pre-built wheels ==="
          conda run -n gliocarto pip install \
            torch-geometric torch-scatter torch-sparse torch-cluster \
            -f "${PyG_URL}" --no-cache-dir

          echo "=== Step 4: Verify requirements file ==="
          if [ ! -f "$REQS_FILE" ]; then
            echo "Files in workspace:"
            ls -la "${GITHUB_WORKSPACE}"
            echo "ERROR: requirements_server.txt NOT FOUND at: $REQS_FILE"
            exit 1
          fi
          echo "OK: $REQS_FILE"

          echo "=== Step 5: Install remaining packages ==="
          grep -v "^torch" "$REQS_FILE" | \
            grep -v "index-url" | \
            grep -v "pyg.org" | \
            grep -v "^#" | \
            grep -v "^$" > /tmp/filtered_reqs.txt
          conda run -n gliocarto pip install -r /tmp/filtered_reqs.txt --no-cache-dir
          echo "=== Done! ==="

      # ── conda-pack ───────────────────────────────────────────
      - name: Pack Python Environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Install conda-pack in BASE env (recommended approach)
          Write-Host "Installing conda-pack in base..."
          conda install conda-pack -y -c conda-forge

          Write-Host "Locating environment root..."
          $envPath = conda run -n gliocarto python -c "import sys; print(sys.prefix)"
          Write-Host "Environment root: $envPath"

          Write-Host "Aggressive pruning to reduce file size < 2 GB..."
          # Remove pycache/pyc/pyo
          Get-ChildItem -Path $envPath -Recurse -Directory -Filter "__pycache__" -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Path $envPath -Recurse -File -Include "*.pyc", "*.pyo" -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue

          # Remove debug symbols (*.pdb)
          Get-ChildItem -Path $envPath -Recurse -File -Filter "*.pdb" -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue

          # Remove static libraries (*.lib, *.a)
          Get-ChildItem -Path $envPath -Recurse -File -Include "*.lib", "*.a" -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue

          # Remove C/C++ Headers
          if (Test-Path "$envPath\include") { Remove-Item -Recurse -Force "$envPath\include" -ErrorAction SilentlyContinue }

          Write-Host "Packing gliocarto env (5-10 min)..."
          conda-pack -n gliocarto `
            -o "${{ matrix.python_env_zip }}" `
            --ignore-editable-packages `
            --ignore-missing-files

          $f = Get-Item "${{ matrix.python_env_zip }}"
          Write-Host "SUCCESS: $($f.Name) — $([math]::Round($f.Length/1GB,2)) GB"

          Write-Host "Copying pruned environment to python_env directory for bundling..."
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\python_env"
          Copy-Item -Path "$envPath\*" -Destination "$env:GITHUB_WORKSPACE\python_env" -Recurse -Force

      - name: Pack Python Environment (macOS/Linux)
        if: runner.os == 'macOS' || runner.os == 'Linux'
        shell: bash
        run: |
          # Install conda-pack in BASE env (recommended approach)
          echo "Installing conda-pack in base..."
          conda install conda-pack -y -c conda-forge

          # Find the exact conda-pack binary path (bash shell doesn't have conda on PATH)
          CONDA_BASE=$(conda info --base)
          CONDA_PACK_BIN="${CONDA_BASE}/bin/conda-pack"
          echo "conda-pack binary: ${CONDA_PACK_BIN}"

          echo "Locating environment root..."
          ENV_PATH=$(conda run -n gliocarto python -c "import sys; print(sys.prefix)")
          echo "Environment root: ${ENV_PATH}"

          echo "Aggressive pruning to reduce file size..."
          find "${ENV_PATH}" -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find "${ENV_PATH}" -type f -name "*.pyc" -delete 2>/dev/null || true
          find "${ENV_PATH}" -type f -name "*.pyo" -delete 2>/dev/null || true
          find "${ENV_PATH}" -type f -name "*.a" -delete 2>/dev/null || true
          find "${ENV_PATH}" -type f -name "*.lib" -delete 2>/dev/null || true
          rm -rf "${ENV_PATH}/include" 2>/dev/null || true
          find "${ENV_PATH}" -type d -name "tests" -exec rm -rf {} + 2>/dev/null || true
          find "${ENV_PATH}" -type d -name "test" -exec rm -rf {} + 2>/dev/null || true
          rm -rf "${ENV_PATH}/share" 2>/dev/null || true
          if [ "$(uname)" = "Linux" ]; then
            echo "Stripping debug symbols on Linux..."
            find "${ENV_PATH}" -name "*.so" -exec strip --strip-unneeded {} + 2>/dev/null || true
          elif [ "$(uname)" = "Darwin" ]; then
            echo "Stripping debug symbols on macOS..."
            find "${ENV_PATH}" -name "*.dylib" -exec strip -S {} + 2>/dev/null || true
            find "${ENV_PATH}" -name "*.so" -exec strip -S {} + 2>/dev/null || true
          fi

          echo "Packing gliocarto env (5-10 min)..."
          "${CONDA_PACK_BIN}" -n gliocarto \
            -o "${{ matrix.python_env_zip }}" \
            --ignore-editable-packages \
            --ignore-missing-files \
            --zip-symlinks

          ls -lh "${{ matrix.python_env_zip }}"
          echo "SUCCESS"

          echo "Copying pruned environment to python_env directory for bundling..."
          mkdir -p "${GITHUB_WORKSPACE}/python_env"
          cp -R "${ENV_PATH}/"* "${GITHUB_WORKSPACE}/python_env/"


      # ── Electron build ───────────────────────────────────────
      # NOTE: repo root IS the desktop_app — no working-directory needed
      - name: Install NPM Dependencies
        run: npm install --ignore-scripts

      - name: Build Electron App (Windows)
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
        run: npx electron-builder --win --x64 --publish never

      - name: Build Electron App (macOS)
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
        run: npx electron-builder --mac --x64 --publish never

      - name: Build Electron App (Linux)
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
        run: npx electron-builder --linux --x64 --publish never

      # ── Upload artifacts ─────────────────────────────────────
      - name: Upload Python Env Zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.python_env_zip }}
          path: ${{ matrix.python_env_zip }}
          retention-days: 7
          if-no-files-found: error

      - name: Upload Windows Installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: installer-win
          path: dist/*.exe
          retention-days: 7
          if-no-files-found: warn

      - name: Upload macOS Installer
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: installer-mac
          path: dist/*.dmg
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Linux Installer
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: installer-linux
          path: dist/*.AppImage
          retention-days: 7
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────────────
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: List Release Files
        run: find release-files -type f -ls

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Glio-Cartography ${{ github.ref_name }}"
          body: |
            ## Glio-Cartography ${{ github.ref_name }}

            ### 🪟 Windows Kurulum
            1. `Glio-Cartography Setup *.exe` dosyasını indirip çalıştırın
            2. Uygulama ilk açılışta analiz bileşenlerini (~1.5 GB) otomatik indirir

            ### 🍎 macOS Kurulum
            1. `Glio-Cartography*.dmg` dosyasını açın, Applications'a sürükleyin

            > PyTorch 2.6.0 (CPU-only) + PyTorch Geometric 2.7.0
          files: |
            release-files/*.exe
            release-files/*.dmg
            release-files/*.AppImage
            release-files/python_env_windows.zip
            release-files/python_env_macos.zip
            release-files/python_env_linux.zip
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
